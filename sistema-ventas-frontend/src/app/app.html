<header class="app-header">
  <div class="header-left">
    <a routerLink="/" class="logo">Sistema de Ventas</a>
  </div>
  <nav class="header-nav">
    <a routerLink="/catalog" routerLinkActive="active" class="nav-link">Catálogo</a>
    <a routerLink="/cart" routerLinkActive="active" class="nav-link cart-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px;">
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.6 7.5a2 2 0 0 0 1.9 1.5h9.5a2 2 0 0 0 1.9-1.5L23 6H6"></path>
      </svg>
      Carrito
      @if (cartCount() > 0) {
        <span class="cart-badge">{{ cartCount() }}</span>
      }
    </a>
    <a routerLink="/store" routerLinkActive="active" class="nav-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 4px;">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      Tienda
    </a>
    <div class="user-dropdown-wrapper">
      <button class="user-btn" aria-label="Menú de usuario" (click)="toggleUserMenu()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </button>
      @if (showUserMenu()) {
        <div class="dropdown-menu">
          @if (!isAuthenticated) {
            <a routerLink="/login" class="dropdown-item" (click)="showUserMenu.set(false)">Iniciar sesión</a>
            <a routerLink="/register" class="dropdown-item" (click)="showUserMenu.set(false)">Registrarse</a>
          } @else {
            <a routerLink="/sales" class="dropdown-item" (click)="showUserMenu.set(false)">Mis pedidos</a>
            <a routerLink="/notifications" class="dropdown-item" (click)="showUserMenu.set(false)">Mis notificaciones</a>
            <a routerLink="/coupons" class="dropdown-item" (click)="showUserMenu.set(false)">Mis cupones</a>
            <a routerLink="/points" class="dropdown-item" (click)="showUserMenu.set(false)">Mis puntos</a>
            <a routerLink="/recently-viewed" class="dropdown-item" (click)="showUserMenu.set(false)">Visto recientemente</a>
            <a routerLink="/services" class="dropdown-item" (click)="showUserMenu.set(false)">Más servicios</a>
            <button class="dropdown-item logout-item" (click)="logout(); showUserMenu.set(false)">Cerrar sesión</button>
          }
        </div>
      }
    </div>
    <button class="btn-theme" (click)="toggleDarkMode()" aria-label="Toggle theme">
      {{ isDarkMode() ? '☀️' : '🌙' }}
    </button>
  </nav>
</header>

<main class="app-main">
  <router-outlet />
</main>
